<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Abhishek Rathor</title>
    <meta name="robots" content="noindex, follow" />
    <style>
      :root {
        --bg-main: #0b0f19;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent-cyan: #38bdf8;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .container {
        max-width: 500px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 3rem 2rem;
      }
      h1 {
        font-size: 3.5rem;
        margin: 0 0 0.5rem 0;
        color: var(--accent-cyan);
      }
      h2 {
        font-size: 1.5rem;
        margin: 0 0 1rem 0;
      }
      p {
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      a.btn {
        display: inline-block;
        padding: 0.8rem 1.6rem;
        background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
        color: #ffffff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: opacity 0.2s;
      }
      a.btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you are looking for does not exist or has been moved.</p>
      <a href="https://abhishekratho.me/" class="btn">Return to Homepage</a>
    </div>
  </body>
</html>
